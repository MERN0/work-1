# Step keyword vocabulary. ARCHITECTURE.md Sec4.4/Sec8 Q3: the master prompt
# specifies exactly set/wait/verify; the reference workbook uses a materially
# larger vocabulary. This file expands the grammar in a config-driven way (per
# your "start coding now" instruction) rather than blocking on that answer --
# set/wait/verify remain the enforced primitives (single "=" for set, double "=="
# for verify); everything else is additive and can be trimmed back to exactly the
# 3-keyword grammar by deleting entries here, with no code change required.

bracket_keywords:        # fixed positions -- enforced by TestCase validator, not this list
  start: "Test_Start"
  end: "End_of_Test"

primitive_keywords:
  - name: "set"
    pattern: "^set\\s+.+=.+$"
    assignment_operator: "="
  - name: "wait"
    pattern: "^wait(\\s+.+)?$"
  - name: "verify"
    pattern: "^verify\\s+.+==.+$"
    comparison_operator: "=="

extended_keywords:
  - name: "wait_until"
    pattern: "^Wait_Until.*$"
    description: "conditional wait on a signal reaching a value, e.g. Wait_Until CAN_Main_DispSpeed == 0"
  - name: "compound"
    pattern: "^Compound[_ ].+$"
    description: "named macro/sequence, e.g. 'Compound Power_On_A1' -- opaque to the grammar, resolved by the HIL test harness"
  - name: "function_call"
    pattern: "^[A-Za-z_][A-Za-z0-9_]*\\(.*\\)$"
    description: "library/function-style step with inline params, e.g. MDL_SEN_Accelerator_Pedal(Start=30,Stop=0,Step=5,Time=...)"

unknown_keyword_policy: "reject"   # verification_correction_agent treats an unmatched keyword as a correctable issue
