[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sys5-artifact-generator"
version = "1.0.0"
description = "Agentic generation of SYS5 System Qualification Test Cases from SYS2 System Requirements"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "openpyxl==3.1.5",
    "rapidfuzz==3.14.5",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==6.0.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
